[package]
name = "nes"
version = "0.1.0"
edition = "2021"

[dependencies]
sdl2 = "0.38.0"
# A folder picker is the one thing SDL2 does not offer. The gtk3 feature keeps
# rfd on the sync API and off the async portal stack; GTK3 is already what the
# desktop itself links.
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }
# The launcher draws its own text. An 8x8 bitmap font keeps that to one tiny
# dependency instead of SDL2_ttf plus a font file to find at runtime.
font8x8 = "0.3"

# The launcher asks the game to quit with SIGTERM before falling back to
# SIGKILL, so the game's battery save gets its final flush.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3